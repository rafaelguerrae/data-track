# Produção. O domínio (DOMAIN) é substituído na inicialização (ver docker-compose.prod.yml).
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/

# Interno: só acessível pela rede do compose (usado pela API). Porta não publicada.
listener 1883

# Externo: TLS para os dispositivos, com o certificado emitido pelo Caddy.
listener 8883
certfile /certs/certificates/acme-v02.api.letsencrypt.org-directory/__DOMAIN__/__DOMAIN__.crt
keyfile /certs/certificates/acme-v02.api.letsencrypt.org-directory/__DOMAIN__/__DOMAIN__.key
